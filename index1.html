<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Happy Raksha Bandhan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Great+Vibes&family=Tiro+Devanagari+Hindi&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: #14040a;
      color: #f8ead0;
      font-family: "Cormorant Garamond", serif;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background:
        radial-gradient(
          ellipse at 50% 78%,
          #6a1e28 0%,
          transparent 52%
        ),
        radial-gradient(
          ellipse at 18% 18%,
          #4a1810 0%,
          transparent 42%
        ),
        #14040a;
    }

    .bg {
      position: absolute;
      inset: -6%;

      background: url("assets/background.png")
        center / cover no-repeat;

      opacity: 0;

      filter: saturate(1.2);
    }

    .mandala {
      position: absolute;

      left: 50%;
      top: 48%;

      width: min(88vmin, 760px);
      height: min(88vmin, 760px);

      transform:
        translate(-50%, -50%)
        scale(0.62);

      opacity: 0;

      mix-blend-mode: screen;

      pointer-events: none;

      z-index: 1;
    }

    canvas#fx {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 8;

      pointer-events: none;
    }

    .vignette {
      position: absolute;

      inset: 0;

      pointer-events: none;

      z-index: 9;

      background:
        radial-gradient(
          ellipse at center,
          transparent 38%,
          rgba(8, 1, 4, 0.78) 100%
        ),
        linear-gradient(
          to top,
          rgba(10, 2, 6, 0.78) 0%,
          transparent 26%
        );
    }

    .pair {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      display: flex;

      align-items: flex-end;
      justify-content: space-between;

      height: min(86vh, 900px);

      padding: 0 3vw;

      z-index: 4;

      pointer-events: none;
    }

    .sister,
    .brother {
      position: relative;

      height: 100%;
      width: auto;

      max-width: 42vw;

      object-fit: contain;

      pointer-events: none;

      opacity: 0;

      filter:
        drop-shadow(
          0 18px 28px rgba(0, 0, 0, 0.45)
        );
    }

    .sister {
      z-index: 4;

      transform: translateX(-70px);
    }

    .brother {
      z-index: 3;

      transform: translateX(70px);
    }

    .diya {
      position: absolute;

      bottom: -4%;

      width: min(36vw, 430px);

      mix-blend-mode: screen;

      opacity: 0;

      z-index: 5;

      pointer-events: none;
    }

    .diya.left {
      left: -5%;
    }

    .diya.right {
      right: -5%;

      transform: scaleX(-1);
    }

    .titles {
      position: absolute;

      left: 50%;
      top: 5.5%;

      transform: translateX(-50%);

      text-align: center;

      z-index: 12;

      width: min(92vw, 900px);

      pointer-events: none;
    }

    .ornament {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 12px;

      opacity: 0;

      color: #f3d27a;

      letter-spacing: 0.45em;

      font-size: 12px;

      margin-bottom: 8px;
    }

    .ornament span {
      width: 70px;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #f3d27a,
          transparent
        );
    }

    .hindi {
      font-family: "Tiro Devanagari Hindi", serif;

      font-size: clamp(24px, 4vw, 50px);

      color: #ffe9b0;

      text-shadow:
        0 0 22px rgba(255, 190, 80, 0.4),
        0 8px 24px rgba(0, 0, 0, 0.55);

      opacity: 0;

      transform: translateY(14px);
    }

    h1 {
      font-family: "Cinzel Decorative", serif;

      font-weight: 700;

      font-size: clamp(22px, 4.6vw, 58px);

      line-height: 1.2;

      margin-top: 4px;

      background:
        linear-gradient(
          180deg,
          #fff6d2 0%,
          #f0c14b 50%,
          #c48a1a 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      filter:
        drop-shadow(
          0 8px 18px rgba(0, 0, 0, 0.5)
        );

      opacity: 0;

      transform:
        translateY(16px)
        scale(0.96);
    }

    .wish {
      position: absolute;

      left: 50%;
      bottom: 7.5%;

      transform:
        translateX(-50%)
        translateY(18px);

      z-index: 12;

      width: min(90vw, 680px);

      text-align: center;

      font-family: "Great Vibes", cursive;

      font-size: clamp(24px, 3.4vw, 44px);

      color: #ffe7c2;

      text-shadow:
        0 6px 20px rgba(0, 0, 0, 0.7);

      opacity: 0;

      pointer-events: none;
    }

    .subwish {
      display: block;

      margin-top: 4px;

      font-family:
        "Cormorant Garamond",
        serif;

      font-style: italic;

      font-size: clamp(13px, 1.5vw, 18px);

      letter-spacing: 0.2em;

      text-transform: uppercase;

      color: #f3d27a;
    }

    .controls {
      position: absolute;

      right: 18px;
      bottom: 18px;

      z-index: 20;

      display: flex;

      gap: 8px;

      opacity: 0;

      pointer-events: none;
    }

    button {
      appearance: none;

      border:
        1px solid
        rgba(243, 210, 122, 0.5);

      background:
        rgba(42, 8, 18, 0.78);

      color: #ffe9b0;

      font-family:
        "Cormorant Garamond",
        serif;

      letter-spacing: 0.16em;

      text-transform: uppercase;

      font-size: 13px;

      padding: 10px 18px;

      border-radius: 999px;

      cursor: pointer;

      backdrop-filter: blur(8px);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);

      border-color: #f3d27a;
    }

    .intro {
      position: absolute;

      inset: 0;

      z-index: 30;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      background:
        radial-gradient(
          ellipse at center,
          rgba(70, 16, 28, 0.28) 0%,
          rgba(10, 2, 6, 0.92) 72%
        );

      transition:
        opacity 0.85s ease,
        visibility 0.85s ease;
    }

    .intro.hide {
      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }

    .intro-mandala {
      width: min(52vmin, 380px);

      mix-blend-mode: screen;

      animation:
        spin 46s linear infinite;

      opacity: 0.9;
    }

    .intro p {
      font-family:
        "Tiro Devanagari Hindi",
        serif;

      color: #ffe9b0;

      font-size:
        clamp(20px, 2.6vw, 30px);

      margin: 6px 0 4px;
    }

    .intro h2 {
      font-family:
        "Cinzel Decorative",
        serif;

      font-size:
        clamp(20px, 3.6vw, 38px);

      background:
        linear-gradient(
          180deg,
          #fff6d2,
          #e2b442
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      margin-bottom: 26px;
    }

    .begin {
      padding: 14px 32px;

      font-size: 15px;
    }

    body.playing .bg {
      animation:
        bgIn 3s ease forwards;
    }

    body.playing .mandala {
      animation:
        mandalaIn 16s ease-out forwards;
    }

    body.playing .sister {
      animation:
        sisterIn
        2.2s
        1.8s
        cubic-bezier(0.22, 1, 0.36, 1)
        forwards;
    }

    body.playing .brother {
      animation:
        brotherIn
        2.2s
        2.1s
        cubic-bezier(0.22, 1, 0.36, 1)
        forwards;
    }

    body.playing .diya.left {
      animation:
        fadeRise
        1.8s
        1s
        ease
        forwards;
    }

    body.playing .diya.right {
      animation:
        fadeRiseFlip
        1.8s
        1.15s
        ease
        forwards;
    }

    body.playing .ornament {
      animation:
        fadeUp
        1.1s
        1.2s
        ease
        forwards;
    }

    body.playing .hindi {
      animation:
        fadeUp
        1.3s
        1.5s
        ease
        forwards;
    }

    body.playing h1 {
      animation:
        titleIn
        1.5s
        2.2s
        cubic-bezier(0.22, 1, 0.36, 1)
        forwards;
    }

    body.playing .wish {
      animation:
        wishIn
        1.4s
        5.2s
        ease
        forwards;
    }

    body.playing .controls {
      animation:
        fadeUp
        0.8s
        5.6s
        ease
        forwards;

      pointer-events: auto;
    }

    @keyframes bgIn {
      to {
        opacity: 0.7;
      }
    }

    @keyframes mandalaIn {
      0% {
        opacity: 0;

        transform:
          translate(-50%, -50%)
          scale(0.55)
          rotate(0deg);
      }

      14% {
        opacity: 0.55;
      }

      100% {
        opacity: 0.4;

        transform:
          translate(-50%, -50%)
          scale(1.04)
          rotate(26deg);
      }
    }

    @keyframes sisterIn {
      to {
        opacity: 1;

        transform:
          translateX(0);
      }
    }

    @keyframes brotherIn {
      to {
        opacity: 1;

        transform:
          translateX(0);
      }
    }

    @keyframes fadeRise {
      to {
        opacity: 0.95;
      }
    }

    @keyframes fadeRiseFlip {
      to {
        opacity: 0.95;

        transform:
          scaleX(-1);
      }
    }

    @keyframes fadeUp {
      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }

    @keyframes wishIn {
      to {
        opacity: 1;

        transform:
          translateX(-50%)
          translateY(0);
      }
    }

    @keyframes titleIn {
      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes spin {
      to {
        transform:
          rotate(360deg);
      }
    }

    @media (max-width: 820px) {
      .pair {
        height: 68vh;

        padding: 0 1.5vw;
      }

      .sister,
      .brother {
        max-width: 46vw;
      }

      .wish {
        bottom: 12%;
      }

      .diya {
        width: 48vw;
      }
    }
  </style>
</head>

<body>

  <div class="stage">

    <!-- BACKGROUND MUSIC -->
    <audio
      id="bgMusic"
      src="assets/raksha-bandhan.mp3"
      preload="auto"
      loop>
    </audio>


    <!-- BACKGROUND -->
    <div class="bg"></div>

    <img
      class="mandala"
      src="assets/mandala-cut.png"
      alt=""
    />


    <!-- SISTER + BROTHER -->
    <div class="pair">

      <img
        class="sister"
        src="assets/sister-cut.png"
        alt="Sister holding a rakhi"
      />

      <img
        class="brother"
        src="assets/brother-flat.jpg?v=flip"
        alt="Brother receiving the rakhi"
      />

    </div>


    <!-- DIYAS -->
    <img
      class="diya left"
      src="assets/diyas-cut.png"
      alt=""
    />

    <img
      class="diya right"
      src="assets/diyas-cut.png"
      alt=""
    />


    <!-- TITLES -->
    <div class="titles">

      <div class="ornament">
        <span></span>
        ✦
        <span></span>
      </div>

      <p class="hindi">
        रक्षा बंधन की शुभकामनाएँ
      </p>

      <h1>
        Happy Raksha Bandhan
      </h1>

    </div>


    <!-- WISH -->
    <p class="wish">

      A thread of love, a promise of protection

      <span class="subwish">
        May this sacred bond last forever
      </span>

    </p>


    <!-- PARTICLES -->
    <canvas id="fx"></canvas>

    <div class="vignette"></div>


    <!-- CONTROLS -->
    <div class="controls">

      <button
        type="button"
        id="replay">
        Replay
      </button>

      <button
        type="button"
        id="mute">
        Sound on
      </button>

    </div>


    <!-- INTRO -->
    <div
      class="intro"
      id="intro">

      <img
        class="intro-mandala"
        src="assets/mandala-cut.png"
        alt=""
      />

      <p>
        रक्षा बंधन
      </p>

      <h2>
        Happy Raksha Bandhan
      </h2>

      <button
        type="button"
        class="begin"
        id="begin">

        Begin the ritual

      </button>

    </div>

  </div>


  <script>

    /* =========================================
       ELEMENTS
    ========================================= */

    const canvas =
      document.getElementById("fx");

    const ctx =
      canvas.getContext("2d");

    const intro =
      document.getElementById("intro");

    const bgMusic =
      document.getElementById("bgMusic");

    const beginButton =
      document.getElementById("begin");

    const replayButton =
      document.getElementById("replay");

    const muteButton =
      document.getElementById("mute");


    /* =========================================
       VARIABLES
    ========================================= */

    let playing = false;

    let soundOn = true;

    const petals = [];


    /* =========================================
       AUDIO SETTINGS
    ========================================= */

    bgMusic.loop = true;

    bgMusic.volume = 0.5;


    /* =========================================
       CANVAS RESIZE
    ========================================= */

    function resize() {

      canvas.width =
        window.innerWidth *
        devicePixelRatio;

      canvas.height =
        window.innerHeight *
        devicePixelRatio;

      canvas.style.width =
        window.innerWidth + "px";

      canvas.style.height =
        window.innerHeight + "px";

      ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
      );
    }


    window.addEventListener(
      "resize",
      resize
    );

    resize();


    /* =========================================
       PETAL CREATOR
    ========================================= */

    function makePetal() {

      return {

        x:
          Math.random() *
          window.innerWidth,

        y:
          -24 -
          Math.random() * 90,

        r:
          5 +
          Math.random() * 8,

        vy:
          0.55 +
          Math.random() * 1.35,

        vx:
          -0.35 +
          Math.random() * 0.7,

        rot:
          Math.random() *
          Math.PI *
          2,

        vr:
          -0.03 +
          Math.random() * 0.06,

        color:
          Math.random() > 0.42
            ? "#e37a2c"
            : "#d45a78",

        inner:
          Math.random() > 0.42
            ? "#f4c14a"
            : "#f0a3b8",

        sway:
          Math.random() *
          Math.PI *
          2,

        a:
          0.55 +
          Math.random() * 0.4
      };
    }


    /* =========================================
       CREATE PETALS
    ========================================= */

    for (let i = 0; i < 52; i++) {

      const p = makePetal();

      p.y =
        Math.random() *
        window.innerHeight;

      petals.push(p);
    }


    /* =========================================
       PETAL ANIMATION
    ========================================= */

    function tick() {

      ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
      );

      for (const p of petals) {

        p.sway += 0.01;

        p.x +=
          p.vx +
          Math.sin(p.sway) *
          0.35;

        p.y += p.vy;

        p.rot += p.vr;


        if (
          p.y >
          window.innerHeight + 28
        ) {

          Object.assign(
            p,
            makePetal()
          );
        }


        ctx.save();

        ctx.translate(
          p.x,
          p.y
        );

        ctx.rotate(
          p.rot
        );

        ctx.globalAlpha =
          p.a;

        ctx.fillStyle =
          p.color;

        ctx.beginPath();

        ctx.ellipse(
          0,
          0,
          p.r * 0.55,
          p.r,
          0,
          0,
          Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle =
          p.inner;

        ctx.globalAlpha =
          p.a * 0.8;

        ctx.beginPath();

        ctx.ellipse(
          0,
          -p.r * 0.15,
          p.r * 0.22,
          p.r * 0.55,
          0,
          0,
          Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
      }

      requestAnimationFrame(
        tick
      );
    }


    requestAnimationFrame(
      tick
    );


    /* =========================================
       REMOVE BLACK BACKGROUND FROM IMAGES
    ========================================= */

    function knockBlack(
      img,
      thresh
    ) {

      return img
        .decode()
        .then(function () {

          const c =
            document.createElement(
              "canvas"
            );

          const w =
            img.naturalWidth;

          const h =
            img.naturalHeight;

          if (!w || !h) return;

          c.width = w;
          c.height = h;

          const g =
            c.getContext(
              "2d",
              {
                willReadFrequently: true
              }
            );

          g.drawImage(
            img,
            0,
            0
          );

          const imageData =
            g.getImageData(
              0,
              0,
              w,
              h
            );

          const d =
            imageData.data;

          const vis =
            new Uint8Array(
              w * h
            );

          const q = [];


          function isBg(idx) {

            const o =
              idx * 4;

            const a =
              d[o + 3];

            if (a < 10)
              return true;

            const lum =
              0.2126 * d[o] +
              0.7152 * d[o + 1] +
              0.0722 * d[o + 2];

            return lum < thresh;
          }


          function tryPush(
            x,
            y
          ) {

            if (
              x < 0 ||
              y < 0 ||
              x >= w ||
              y >= h
            ) return;

            const idx =
              y * w + x;

            if (vis[idx])
              return;

            vis[idx] = 1;

            if (
              isBg(idx)
            ) {

              q.push(idx);
            }
          }


          for (
            let x = 0;
            x < w;
            x++
          ) {

            tryPush(x, 0);

            tryPush(
              x,
              h - 1
            );
          }


          for (
            let y = 0;
            y < h;
            y++
          ) {

            tryPush(0, y);

            tryPush(
              w - 1,
              y
            );
          }


          while (q.length) {

            const idx =
              q.pop();

            d[
              idx * 4 + 3
            ] = 0;

            const x =
              idx % w;

            const y =
              (idx / w) | 0;

            tryPush(
              x + 1,
              y
            );

            tryPush(
              x - 1,
              y
            );

            tryPush(
              x,
              y + 1
            );

            tryPush(
              x,
              y - 1
            );
          }


          g.putImageData(
            imageData,
            0,
            0
          );

          img.src =
            c.toDataURL(
              "image/webp"
            );

        })
         color: #f3d27a;
      letter-spacing: 0.45em;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .ornament span {
      width: 70px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #f3d27a, transparent);
    }

    .hindi {
      font-family: "Tiro Devanagari Hindi", serif;
      font-size: clamp(24px, 4vw, 50px);
      color: #ffe9b0;
      text-shadow: 0 0 22px rgba(255, 190, 80, 0.4), 0 8px 24px rgba(0, 0, 0, 0.55);
      opacity: 0;
      transform: translateY(14px);
    }

    h1 {
      font-family: "Cinzel Decorative", serif;
      font-weight: 700;
      font-size: clamp(22px, 4.6vw, 58px);
      line-height: 1.2;
      margin-top: 4px;
      background: linear-gradient(180deg, #fff6d2 0%, #f0c14b 50%, #c48a1a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5));
      opacity: 0;
      transform: translateY(16px) scale(0.96);
    }

    .wish {
      position: absolute;
      left: 50%;
      bottom: 7.5%;
      transform: translateX(-50%) translateY(18px);
      z-index: 12;
      width: min(90vw, 680px);
      text-align: center;
      font-family: "Great Vibes", cursive;
      font-size: clamp(24px, 3.4vw, 44px);
      color: #ffe7c2;
      text-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
      opacity: 0;
      pointer-events: none;
    }

    .subwish {
      display: block;
      margin-top: 4px;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: clamp(13px, 1.5vw, 18px);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #f3d27a;
    }

    .controls {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      display: flex;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
    }

    button {
      appearance: none;
      border: 1px solid rgba(243, 210, 122, 0.5);
      background: rgba(42, 8, 18, 0.78);
      color: #ffe9b0;
      font-family: "Cormorant Garamond", serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    button:hover {
      transform: translateY(-1px);
      border-color: #f3d27a;
    }

    .intro {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(70, 16, 28, 0.28) 0%, rgba(10, 2, 6, 0.92) 72%);
      transition: opacity 0.85s ease, visibility 0.85s ease;
    }
    .intro.hide { opacity: 0; visibility: hidden; pointer-events: none; }

    .intro-mandala {
      width: min(52vmin, 380px);
      mix-blend-mode: screen;
      animation: spin 46s linear infinite;
      opacity: 0.9;
    }

    .intro p {
      font-family: "Tiro Devanagari Hindi", serif;
      color: #ffe9b0;
      font-size: clamp(20px, 2.6vw, 30px);
      margin: 6px 0 4px;
    }

    .intro h2 {
      font-family: "Cinzel Decorative", serif;
      font-size: clamp(20px, 3.6vw, 38px);
      background: linear-gradient(180deg, #fff6d2, #e2b442);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 26px;
    }

    .begin { padding: 14px 32px; font-size: 15px; }

    body.playing .bg { animation: bgIn 3s ease forwards; }
    body.playing .mandala { animation: mandalaIn 16s ease-out forwards; }
    body.playing .sister { animation: sisterIn 2.2s 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    body.playing .brother { animation: brotherIn 2.2s 2.1s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    body.playing .diya.left { animation: fadeRise 1.8s 1s ease forwards; }
    body.playing .diya.right { animation: fadeRiseFlip 1.8s 1.15s ease forwards; }
    body.playing .ornament { animation: fadeUp 1.1s 1.2s ease forwards; }
    body.playing .hindi { animation: fadeUp 1.3s 1.5s ease forwards; }
    body.playing h1 { animation: titleIn 1.5s 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    body.playing .wish { animation: wishIn 1.4s 5.2s ease forwards; }
    body.playing .controls { animation: fadeUp 0.8s 5.6s ease forwards; pointer-events: auto; }

    @keyframes bgIn {
      to { opacity: 0.7; }
    }
    @keyframes mandalaIn {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.55) rotate(0deg); }
      14% { opacity: 0.55; }
      100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1.04) rotate(26deg); }
    }
    @keyframes sisterIn {
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes brotherIn {
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeRise { to { opacity: 0.95; } }
    @keyframes fadeRiseFlip { to { opacity: 0.95; transform: scaleX(-1); } }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes wishIn {
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes titleIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 820px) {
      .pair { height: 68vh; padding: 0 1.5vw; }
      .sister, .brother { max-width: 46vw; }
      .wish { bottom: 12%; }
      .diya { width: 48vw; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="bg"></div>
    <img class="mandala" src="assets/mandala-cut.png" alt="" />

    <div class="pair">
      <img class="sister" src="assets/sister-cut.png" alt="Sister holding a rakhi" />
      <img class="brother" src="assets/brother-flat.jpg?v=flip" alt="Brother receiving the rakhi" />
    </div>

    <img class="diya left" src="assets/diyas-cut.png" alt="" />
    <img class="diya right" src="assets/diyas-cut.png" alt="" />

    <div class="titles">
      <div class="ornament"><span></span>✦<span></span></div>
      <p class="hindi">रक्षा बंधन की शुभकामनाएँ</p>
      <h1>Happy Raksha Bandhan</h1>
    </div>

    <p class="wish">
      A thread of love, a promise of protection
      <span class="subwish">May this sacred bond last forever</span>
    </p>

    <canvas id="fx"></canvas>
    <div class="vignette"></div>

    <div class="controls">
      <button type="button" id="replay">Replay</button>
      <button type="button" id="mute">Sound on</button>
    </div>

    <div class="intro" id="intro">
      <img class="intro-mandala" src="assets/mandala-cut.png" alt="" />
      <p>रक्षा बंधन</p>
      <h2>Happy Raksha Bandhan</h2>
      <button type="button" class="begin" id="begin">Begin the ritual</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");
    const intro = document.getElementById("intro");
    let playing = false;
    let soundOn = true;
    let audioCtx = null;
    const petals = [];

    function resize() {
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    function makePetal() {
      return {
        x: Math.random() * window.innerWidth,
        y: -24 - Math.random() * 90,
        r: 5 + Math.random() * 8,
        vy: 0.55 + Math.random() * 1.35,
        vx: -0.35 + Math.random() * 0.7,
        rot: Math.random() * Math.PI * 2,
        vr: -0.03 + Math.random() * 0.06,
        color: Math.random() > 0.42 ? "#e37a2c" : "#d45a78",
        inner: Math.random() > 0.42 ? "#f4c14a" : "#f0a3b8",
        sway: Math.random() * Math.PI * 2,
        a: 0.55 + Math.random() * 0.4
      };
    }

    for (let i = 0; i < 52; i++) {
      const p = makePetal();
      p.y = Math.random() * window.innerHeight;
      petals.push(p);
    }

    function knockBlack(img, thresh) {
      return img.decode().then(function () {
        const c = document.createElement("canvas");
        const w = img.naturalWidth;
        const h = img.naturalHeight;
        if (!w || !h) return;
        c.width = w;
        c.height = h;
        const g = c.getContext("2d", { willReadFrequently: true });
        g.drawImage(img, 0, 0);
        const imageData = g.getImageData(0, 0, w, h);
        const d = imageData.data;
        const vis = new Uint8Array(w * h);
        const q = [];

        function isBg(idx) {
          const o = idx * 4;
          const a = d[o + 3];
          if (a < 10) return true;
          const lum = 0.2126 * d[o] + 0.7152 * d[o + 1] + 0.0722 * d[o + 2];
          return lum < thresh;
        }

        function tryPush(x, y) {
          if (x < 0 || y < 0 || x >= w || y >= h) return;
          const idx = y * w + x;
          if (vis[idx]) return;
          vis[idx] = 1;
          if (isBg(idx)) q.push(idx);
        }

        for (let x = 0; x < w; x++) { tryPush(x, 0); tryPush(x, h - 1); }
        for (let y = 0; y < h; y++) { tryPush(0, y); tryPush(w - 1, y); }

        while (q.length) {
          const idx = q.pop();
          d[idx * 4 + 3] = 0;
          const x = idx % w;
          const y = (idx / w) | 0;
          tryPush(x + 1, y);
          tryPush(x - 1, y);
          tryPush(x, y + 1);
          tryPush(x, y - 1);
        }

        g.putImageData(imageData, 0, 0);
        img.src = c.toDataURL("image/webp");
      }).catch(function () { /* keep original if decode fails */ });
    }

    knockBlack(document.querySelector(".sister"), 40);
    knockBlack(document.querySelector(".brother"), 36);
    knockBlack(document.querySelector(".diya.left"), 34);
    knockBlack(document.querySelector(".diya.right"), 34);

    function tick() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (const p of petals) {
        p.sway += 0.01;
        p.x += p.vx + Math.sin(p.sway) * 0.35;
        p.y += p.vy;
        p.rot += p.vr;
        if (p.y > window.innerHeight + 28) Object.assign(p, makePetal());
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = p.a;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.r * 0.55, p.r, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = p.inner;
        ctx.globalAlpha = p.a * 0.8;
        ctx.beginPath();
        ctx.ellipse(0, -p.r * 0.15, p.r * 0.22, p.r * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function playTone(freq, time, dur, type, gain) {
      if (!soundOn || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(gain, time + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time + dur + 0.05);
    }

    function playBell(freq, when, gain = 0.08) {
      playTone(freq, when, 1.6, "sine", gain);
      playTone(freq * 2.01, when, 1.1, "triangle", gain * 0.22);
    }

    function soundtrack() {
      if (!soundOn) return;
      ensureAudio();
      const t = audioCtx.currentTime;
      const drone = audioCtx.createOscillator();
      const drone2 = audioCtx.createOscillator();
      const dg = audioCtx.createGain();
      drone.type = "sine";
      drone2.type = "sine";
      drone.frequency.value = 110;
      drone2.frequency.value = 165;
      dg.gain.setValueAtTime(0, t);
      dg.gain.linearRampToValueAtTime(0.032, t + 1.3);
      dg.gain.setValueAtTime(0.032, t + 10);
      dg.gain.linearRampToValueAtTime(0.0001, t + 14);
      drone.connect(dg); drone2.connect(dg); dg.connect(audioCtx.destination);
      drone.start(t); drone2.start(t);
      drone.stop(t + 14.2); drone2.stop(t + 14.2);
      playBell(523.25, t + 0.35, 0.07);
      playBell(659.25, t + 1.05, 0.06);
      playBell(783.99, t + 1.75, 0.07);
      playBell(1046.5, t + 4.5, 0.09);
      playBell(1318.5, t + 7.2, 0.11);
      playBell(987.77, t + 7.45, 0.07);
      playBell(784, t + 8.2, 0.08);
    }

    function restartAnimation() {
      document.body.classList.remove("playing");
      void document.body.offsetWidth;
      document.body.classList.add("playing");
      soundtrack();
    }

    document.getElementById("begin").addEventListener("click", () => {
      ensureAudio();
      playing = true;
      intro.classList.add("hide");
      restartAnimation();
    });

    document.getElementById("replay").addEventListener("click", () => {
      ensureAudio();
      restartAnimation();
    });

    document.getElementById("mute").addEventListener("click", (e) => {
      soundOn = !soundOn;
      e.target.textContent = soundOn ? "Sound on" : "Sound off";
      if (soundOn) ensureAudio();
    });
  </script>
</body>
</html>
